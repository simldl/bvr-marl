# Training Configuration for BVR Air Combat RL
# Uses MLP architecture with neural wrapper and sparse terminal rewards

# Environment Configuration
env:
  num_agents_per_side: 2
  map_size: 200  # km
  max_steps: 1024  # Maximum steps per episode
  debug: false

  # Simulation timing
  simulation_config:
    tick_secs: 1.0  # Each step = 1 simulation second
    max_real_time_s: null
    early_termination:
      all_enemies_dead: true
      mission_complete: true
      no_missiles_remaining: false

  # Weapon configuration
  weapon_config:
    missile_hit_radius_m: 500.0
    gun_hit_radius_m: 5.0

  # Aircraft types
  aircraft_config:
    agent_type: "Eurofighter"
    opponent_type: "Eurofighter"

  # Missile types
  missile_config:
    agent_missiles: ["AIM120_AMRAAM"]
    opponent_missiles: ["AIM120_AMRAAM"]

# Framework Configuration
framework: torch
num_gpus: 1

# Training Hyperparameters
training:
  steps: 512
  learning_rate: 0.0003
  batch_size: 256
  n_envs: 1
  rollout_fragment_length: 128
  clip_param: 0.2
  entropy_coef: 0.01
  vf_loss_coeff: 0.5
  num_epochs: 3
  sgd_minibatch_size: 32
  grad_clip: null
  use_gae: true
  lambda: 0.95
  gamma: 0.995

# Model Configuration
model:
  # Neural wrapper - combines neural control with automation
  use_neural_wrapper: true
  neural_wrapper_config:
    wrapped_action_dim: 4  # NN controls: Ps, n, φ, missile_fire
    full_action_dim: 10    # Full space includes automated actions
    automation_level: "balanced"  # Options: defensive, balanced, aggressive
    enable_countermeasures: true
    enable_target_selection: true
    enable_gun_control: true

  # MLP Network architecture
  model_config:
    action_dim: 4
    hidden_dim: 256
    num_hidden_layers: 3
    activation: relu
    init_log_std: -0.5

# Rewards - Terminal/Sparse only
rewards:
  destruction_penalty: -200.0
  kill_reward: 200.0
  last_team_reward: 40.0
  boundary_violation_penalty: -200.0

# Logging Configuration
logging:
  log_dir: "./logs"
  save_dir: "./models"
  model_name: "bvr_combat"
  use_tensorboard: true

# Environment runners
num_env_runners: 30
num_envs_per_env_runner: 1

# Hydra configuration
hydra:
  job:
    chdir: false
