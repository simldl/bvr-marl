# Visualization Configuration
# This config file allows you to set paths and parameters for 2d_live_view.py
# All paths are relative to the air_to_air_rl/ directory

# Path to the trained model checkpoint
# Set to null to use random actions instead
checkpoint_path: null # Set to null for random actions by default

# Path to model config override file (optional)
model_config_path: null

# Path to training config file (optional, defaults to configs/training/base.yaml)
# IMPORTANT: This must match the config used to train the checkpoint!
train_config_path: configs/training/presets/simple.yaml

# Environment type: "bvr" (full radar/AWACS/gun) or "simplified" (truth obs, 4-dim actions)
env_type: simplified

# Visualization settings
visualization:
  frames: 100        # Number of frames to simulate
  interval: 100      # Interval between frames in milliseconds
  real_time_speed: false  # If true, syncs interval to simulation tick rate for real-time playback
  save_video: false  # Whether to save the visualization as a video
  symbol_mode: flying_objects   # Symbol rendering: "nato" (MIL-STD-2525C frames), "flying_objects" (type-specific silhouettes), "procedural" (Cairo shapes)
  dpi: 200            # Render resolution: 200=default, 300=high, 400=ultra
  symbol_scale: 2.0   # Sprite magnification: 1.0=original, 2.0=double (default), 3.0=triple