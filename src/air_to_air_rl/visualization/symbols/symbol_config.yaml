# Symbol configuration for tactical visualization
#
# Two rendering modes (set symbol_mode in viz_config.yaml):
#
#   nato:           MIL-STD-2525C compliant frames with designator text.
#                   Applies to all aircraft and SAM batteries.
#                   SAMs always use this mode regardless of global setting.
#                   Generated by: node visualization/symbols/generate_symbols.js
#
#   flying_objects: Type-specific aircraft/missile silhouette icons.
#                   Files: symbols/flying_objects/{type}_{side}.svg
#                   Types: f22, f35, eurofighter, su57, awacs, missile, f15ex
#                   Sides: blue, red
#                   Missiles always use this mode regardless of global setting.
#                   Generated by: node visualization/symbols/generate_symbols.js
#
#   procedural:     Original hand-drawn Cairo polygon shapes (no external files needed).
#
# Special rules:
#   - Missiles  → always flying_objects (missile_blue / missile_red)
#   - SAM sites → always nato (sam_friendly / sam_hostile / …)
#
# Generate all PNG assets (both nato and flying_objects) with:
#     node visualization/symbols/generate_symbols.js

nato_symbols:
  fighter:
    sidc_template: SXAPMFF-------    # "F" inside friendly air frame
  awacs:
    sidc_template: SXAP----------    # Blank air frame + injected "AEW" text
    inject_text: AEW
  sam:
    sidc_template: SXGPUCD-------    # Ground combat, air defense unit

affiliations:
  agent: friendly    # blue team -> friendly
  opponent: hostile  # red team -> hostile
