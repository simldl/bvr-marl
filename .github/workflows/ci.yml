name: CI

on:
  push:
    branches: [main, "refactor/**", "claude/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libcairo2-dev

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Run fast tests
        run: pytest tests/ -q -m "not slow" --tb=short

      - name: Run slow tests
        run: pytest tests/ -q -m "slow" --tb=short
        # Run slow tests last so lint/unit failures surface quickly

      - name: Check source encoding
        run: python scripts/check_encoding.py

      - name: Check import boundaries
        run: python scripts/check_import_boundaries.py
