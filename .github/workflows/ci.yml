name: CI

on:
  push:
    branches: [main, "refactor/**", "claude/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libcairo2-dev

      # Headroom before the dependency tree lands. MEASURED on run 33845446530:
      # the runner arrives with 72G total, 62G used, 9.9G AVAILABLE — well under
      # the ~14 GB these images are usually said to have — and this step takes it
      # to 32G. These toolchains are preinstalled and unused here. Do NOT add
      # $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache) to this list: that is where
      # actions/setup-python put the interpreter this job is running on.
      # `|| true` because the exact set present varies by image revision and a
      # missing directory must not fail the build.
      - name: Free runner disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/.ghcup || true
          df -h /

      # The Linux job, and only the Linux job, ran the runner out of disk while
      # installing dependencies:
      #   ERROR: Could not install packages due to an OSError:
      #   [Errno 28] No space left on device
      # The cause is `torch` on PyPI: the Linux wheel is the CUDA build and drags
      # the nvidia-* CUDA runtime wheels in behind it — several GB installed, and
      # as much again in the pip cache restored by setup-python above. Measured
      # with scripts/ci/check_linux_wheel_size.py: the PyPI tree is 2538 MB of
      # wheels, 1973 MB of it CUDA, against 206 MB from the CPU index — a 92%
      # cut and roughly 4.7 GB less peak disk. The Windows wheel is CPU-only,
      # which is why that leg never failed. No hosted runner has a GPU, so the
      # CUDA build was never going to be exercised in the first place.
      #
      # Installing torch from the CPU index FIRST satisfies the `torch>=2.7.0`
      # requirement, so the editable install below leaves it alone instead of
      # resolving the CUDA wheel. Keep this step ahead of the install step.
      # Verified on run 33845446530: the install step logs
      # "Requirement already satisfied: torch>=2.7.0 ... (2.14.0+cpu)" and no
      # nvidia-* wheel appears anywhere in its output.
      # Mirrored in the extension package's workflow; change the two together.
      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/ scripts/

      - name: Run fast tests
        run: pytest tests/ -q -m "not slow" --tb=short

      - name: Run slow tests
        run: pytest tests/ -q -m "slow" --tb=short
        # Run slow tests last so lint/unit failures surface quickly

      - name: Check source encoding
        run: python scripts/check_encoding.py

      - name: Check import boundaries
        run: python scripts/check_import_boundaries.py
