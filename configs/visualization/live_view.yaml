# Visualization Configuration — Live interactive view
# Optimised for responsive live playback: lower DPI, faster interval.
# Suitable for real-time monitoring during or after training.

checkpoint_path: null
model_config_path: null
train_config_path: configs/training/large_map_heterogeneous.yaml
env_type: bvr
scenario: default

visualization:
  frames: 200          # Shorter run for quick interactive inspection
  interval: 80         # ms between frames (faster than default for smoother playback)
  real_time_speed: false
  save_video: false
  save_rewards: false  # Skip reward logs for interactive use
  symbol_mode: flying_objects
  dpi: 150             # Reduced for faster rendering
  symbol_scale: 2.0
  show_text: true
  labeling:
    focus_unit_id: null       # Hovering or clicking an aircraft selects it
    video_focus_rule: none
