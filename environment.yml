name: rlenv
channels:
  - conda-forge
  - defaults
dependencies:
  # Base Python
  - python=3.12.12

  # Core conda packages (compiled dependencies)
  - pip=25.2
  - setuptools=80.9.0
  - wheel=0.45.1

  # System libraries
  - openssl=3.0.18
  - sqlite=3.50.2
  - zlib=1.3.1
  - bzip2=1.0.8
  - libffi=3.4.4
  - tk=8.6.15
  - xz=5.6.4

  # C/C++ runtime
  - ucrt=10.0.22621.0
  - vc=14.3
  - vc14_runtime=14.44.35208
  - vs2015_runtime=14.44.35208

  # Install PyPI packages via pip
  - pip:
    # Core ML/RL Framework
    - ray[default]==2.50.1
    - gymnasium==1.2.1

    # Deep Learning Utilities
    - tensorboard==2.20.0
    - tensorboard-data-server==0.7.2
    - tensorboardX==2.6.4

