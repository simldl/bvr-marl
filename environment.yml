    - matplotlib==3.10.7
    - cartopy==0.25.0
    - pillow==11.3.0
    - pycairo==1.28.0
    - svgwrite==1.4.3

    # Geospatial
    - pyproj==3.7.2
    - pyshp==3.0.2.post1
    - shapely==2.1.2
    - geographiclib==2.1

    # Web/API
    - fastapi==0.119.1
    - uvicorn==0.38.0
    - starlette==0.48.0
    - websockets==15.0.1
    - aiohttp==3.13.1
    - aiohttp-cors==0.8.1
    - aiohappyeyeballs==2.6.1
    - aiosignal==1.4.0
    - frozenlist==1.8.0
