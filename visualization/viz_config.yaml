# Visualization Configuration for BVR Air Combat RL
# Configuration for 2d_live_view.py
# All paths are relative to the air_to_air_rl/ directory

# Path to the trained model checkpoint
# Set to null to use random actions instead
checkpoint_path: null

# Path to training config file
# Uses the main training configuration for environment settings
train_config_path: reinforcement_learning/configs/train_config.yaml

# Visualization settings
visualization:
  frames: 100        # Number of frames to simulate
  interval: 100      # Interval between frames in milliseconds
  real_time_speed: false  # If true, syncs interval to simulation tick rate
  save_video: false  # Whether to save the visualization as a video
  save_rewards: false # Whether to save detailed reward logs (CSV + JSON)
